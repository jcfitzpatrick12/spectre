name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build development image
        run: docker build --target development -t spectre-dev-server:ci backend/

      - name: Build runtime image
        run: docker build --target runtime -t spectre-server:ci backend/

      - name: Black
        run: docker run --rm -w /app/backend spectre-dev-server:ci black --check .

      - name: Mypy
        run: docker run --rm -w /app/backend spectre-dev-server:ci mypy src tests

      - name: Pytest unit
        run: docker run --rm -w /app/backend spectre-dev-server:ci pytest tests/unit -q

      - name: Pytest integration
        run: docker run --rm -w /app/backend spectre-dev-server:ci pytest tests/integration -q

  cli:
    name: cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build development image
        run: docker build --target development -t spectre-dev-cli:ci cli/

      - name: Build runtime image
        run: docker build --target runtime -t spectre-cli:ci cli/

      - name: Black
        run: docker run --rm -w /app/cli spectre-dev-cli:ci black --check .

      - name: Mypy
        run: docker run --rm -w /app/cli spectre-dev-cli:ci mypy src

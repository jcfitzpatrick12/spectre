services:
  spectre-server:
    container_name: spectre-server
    image: spectregrams/spectre-server:4.2.2  # x-release-please-version
    environment:
      - SPECTRE_GID=${SPECTRE_GID}
      - SPECTRE_BIND_HOST=${SPECTRE_BIND_HOST}
      - SPECTRE_BIND_PORT=${SPECTRE_BIND_PORT}
    group_add:
      - "${SPECTRE_GID}"
    networks:
      - spectre-network
    volumes:
      - spectre-data-v4:/app/.spectre-data
    devices:
      - "/dev/bus/usb"
    ports:
      - ${SPECTRE_PORT_MAP}
    stop_signal: SIGKILL

  spectre-cli:
    container_name: spectre-cli
    image: spectregrams/spectre-cli:4.2.2  # x-release-please-version
    environment:
      - SPECTRE_SERVER_HOST=${SPECTRE_SERVER_HOST}
      - SPECTRE_SERVER_PORT=${SPECTRE_SERVER_PORT}
    networks:
      - spectre-network
    depends_on:
      - spectre-server
    tty: true
    stop_signal: SIGKILL

networks:
  spectre-network:
    name: spectre-network
    driver: bridge

volumes:
  spectre-data-v4:
    name: spectre-data-v4
